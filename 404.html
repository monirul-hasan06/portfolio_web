<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <meta name="robots" content="noindex">
  <title>Page not found — Monirul Hasan Mithu</title>
  <link rel="icon" href="assets/images/favicon.png" type="image/png">
  <link rel="stylesheet" href="assets/css/styles.css">
  <style>
    .error-page{min-height:100svh;display:grid;place-items:center;padding:40px}.error-card{max-width:720px;text-align:center}.error-code{margin:0;color:var(--accent);font-size:clamp(5rem,20vw,11rem);font-weight:950;line-height:.8;letter-spacing:-.09em}.error-card h1{margin:32px 0 12px;font-size:clamp(2rem,6vw,4rem);letter-spacing:-.055em}.error-card p{color:var(--text-soft);margin:0 auto 28px;max-width:550px}
  </style>
</head>
<body>
  <main class="error-page">
    <div class="error-card panel">
      <p class="error-code">404</p>
      <h1>This page does not exist.</h1>
      <p>The address may be incorrect, or the page may have moved. Return to the portfolio homepage.</p>
      <a class="button button-primary" href="/">Back to homepage</a>
    </div>
  </main>
</body>
</html>
